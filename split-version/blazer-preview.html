<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Shader Preview</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
  body { display: grid; place-items: center; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  #error { display: none; position: fixed; inset: 0; margin: 0; padding: 20px; white-space: pre-wrap; color: #ffb4ab; background: #25110f; font: 14px/1.4 monospace; }
  #play { position: fixed; bottom: 20px; left: 20px; padding: 9px 14px; border: 1px solid #ffffff40; border-radius: 6px; background: #161a18c9; color: #fff; cursor: pointer; font: 13px system-ui; }
</style>
<canvas id="preview" width="960" height="1280"></canvas>
<pre id="error"></pre>
<button id="play" type="button" hidden>Pause orbit</button>
<script>
const canvas = document.querySelector('#preview');
const error = document.querySelector('#error');
const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true });
const params = new URLSearchParams(window.location.search);
const shaderName = params.get('shader') || 'selfie_modifyAndStudy.glsl';
document.title = 'Shader Preview — ' + shaderName;

const vertexSource = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragmentPrelude = `#version 300 es
precision highp float;
precision highp int;
uniform vec3 iResolution;
uniform float iTime;
uniform int iFrame;
uniform sampler2D iChannel0;
uniform sampler2D iChannel1;
uniform sampler2D iChannel2;
uniform sampler2D iChannel3;
out vec4 shaderOutput;
`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

async function start() {
  try {
    if (!gl) throw new Error('This preview needs WebGL2.');
    const configResponse = await fetch('./' + shaderName.replace(/\.glsl$/, '.sha.json'));
    const config = configResponse.ok ? await configResponse.json() : {};
    const resolution = config.passes?.Image?.resolution || { width: 960, height: 1280 };
    const dimension = (value, fallback) => {
      const parsed = Number(value);
      return Number.isFinite(parsed) && parsed >= 64 && parsed <= 4096 ? Math.round(parsed) : fallback;
    };
    canvas.width = dimension(params.get('width'), resolution.width);
    canvas.height = dimension(params.get('height'), resolution.height);
    const commonSource = await fetch('./common.glsl').then(response => response.text());
    const shaderSource = await fetch('./' + shaderName).then(response => response.text());
    const fragmentSource = fragmentPrelude + commonSource + '\n' + shaderSource + '\nvoid main() { mainImage(shaderOutput, gl_FragCoord.xy); }';
    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));

    gl.useProgram(program);
    const vertices = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vertices);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, 'position');
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
    gl.uniform3f(gl.getUniformLocation(program, 'iResolution'), canvas.width, canvas.height, 1.0);
    gl.uniform1f(gl.getUniformLocation(program, 'iTime'), 0.0);
    gl.uniform1i(gl.getUniformLocation(program, 'iFrame'), 0);

    const loadTexture = async (unit, src, filter = gl.LINEAR, wrap = gl.CLAMP_TO_EDGE, vflip = false) => {
      const image = new Image();
      image.src = './' + src;
      await image.decode();
      const tex = gl.createTexture();
      gl.activeTexture(unit);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, vflip);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      return tex;
    };

    const fallback = gl.createTexture();
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, fallback);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const blank = new Uint8Array([0, 0, 0, 255]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, blank);

    const atlas = await loadTexture(gl.TEXTURE0, 'texture0.png', gl.LINEAR, gl.CLAMP_TO_EDGE);
    const texture2 = await loadTexture(gl.TEXTURE2, 'texture2.png', gl.LINEAR, gl.REPEAT);
    const texture3 = await loadTexture(gl.TEXTURE3, 'texture3.png', gl.NEAREST, gl.REPEAT);
    const photoEnabled = /^\s*#define\s+PHOTO_BACKGROUND\s+1\b/m.test(commonSource);
    if (photoEnabled) {
      const photo = config.passes?.Image?.inputs?.iChannel1;
      if (photo?.type !== 'texture' || !photo.path || photo.path === 'texture0.png') {
        throw new Error('Set iChannel1 to the cleaned background photo before enabling PHOTO_BACKGROUND.');
      }
      await loadTexture(gl.TEXTURE1, photo.path, gl.LINEAR, gl.CLAMP_TO_EDGE, photo.vflip === true);
    }

    gl.uniform1i(gl.getUniformLocation(program, 'iChannel0'), 0);
    gl.uniform1i(gl.getUniformLocation(program, 'iChannel1'), 1);
    gl.uniform1i(gl.getUniformLocation(program, 'iChannel2'), 2);
    gl.uniform1i(gl.getUniformLocation(program, 'iChannel3'), 3);

    window.renderAt = (time = 0) => {
      const seconds = Number(time);
      if (!Number.isFinite(seconds) || seconds < 0) throw new Error('Time must be a nonnegative number.');
      gl.uniform1f(gl.getUniformLocation(program, 'iTime'), seconds);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.finish();
      window.previewStats = { time: seconds, width: canvas.width, height: canvas.height };
      return window.previewStats;
    };
    window.renderAt(params.get('time') || 0);
    document.body.dataset.ready = 'true';
    const play = document.querySelector('#play');
    let playing = false;
    let elapsed = Number(params.get('time') || 0);
    let started = performance.now();
    let frameRequest = 0;
    const animate = now => {
      if (!playing) return;
      window.renderAt(elapsed + (now - started) / 1000);
      frameRequest = requestAnimationFrame(animate);
    };
    window.setPlaying = enabled => {
      if (playing === enabled) return;
      if (playing) elapsed += (performance.now() - started) / 1000;
      playing = enabled;
      play.textContent = playing ? 'Pause orbit' : 'Play orbit';
      if (playing) {
        started = performance.now();
        frameRequest = requestAnimationFrame(animate);
      } else cancelAnimationFrame(frameRequest);
    };
    play.addEventListener('click', () => window.setPlaying(!playing));
    document.addEventListener('keydown', event => {
      if (event.code === 'Space' && event.target !== play) {
        event.preventDefault();
        window.setPlaying(!playing);
      }
    });
    // Explicit time URLs stay deterministic for screenshots; normal visits orbit.
    play.hidden = params.has('time');
    if (!params.has('time')) window.setPlaying(true);
  } catch (cause) {
    error.textContent = String(cause);
    error.style.display = 'block';
    document.body.dataset.error = 'true';
  }
}

start();
</script>
</html>
